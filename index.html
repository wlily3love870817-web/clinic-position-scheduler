<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>診所公平排崗</title>
<style>
body{font-family:Arial,'Noto Sans TC',sans-serif;background:#f4f7fb;color:#222;margin:0}header{background:#2457a7;color:white;padding:18px}main{max-width:1100px;margin:18px auto;padding:0 12px}.box{background:white;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}.days{display:flex;gap:8px;overflow:auto}.day{min-width:145px;border:1px solid #ccd5e2;border-radius:8px;padding:8px}.day input{width:100%;box-sizing:border-box;margin:4px 0 8px;padding:7px}button{background:#2457a7;color:white;border:0;border-radius:7px;padding:10px;margin:4px;cursor:pointer}.admin{display:flex;gap:6px;margin:7px 0;flex-wrap:wrap}.admin>*{padding:7px;max-width:220px}table{border-collapse:collapse;width:100%;min-width:620px}td,th{border:1px solid #bbc7d6;padding:8px;text-align:center}th{background:#eaf0ff}.scroll{overflow:auto}.hint{color:#64748b;font-size:13px;line-height:1.6}
</style><body><header><h2>🏥 診所公平自動排崗系統</h2>每週輸入出勤人員，產生櫃／藥／後崗位表</header><main>
<div class="box"><h3>1. 輸入每週出勤人員</h3><p class="hint">每格輸入該診別出勤姓名，以頓號或逗號分開。班別來源：1早班、2午班、3晚班。此版先手動輸入姓名；Excel 月班表自動辨識將後續加入。</p><div class="days" id="days"></div></div>
<div class="box"><h3>2. 行政工作</h3><p class="hint">有行政工作的人員，該診不再排櫃／藥／後。每週可自行新增。</p><div id="admins"></div><button onclick="addAdmin()">＋新增行政事項</button></div>
<div class="box"><h3>3. 歷史崗位次數（選填）</h3><p class="hint">輸入過去累積次數，系統優先安排次數較少的人。資料保存在目前瀏覽器。</p><div class="scroll"><table id="hist"></table></div></div>
<div class="box"><button onclick="run()">⚡自動公平排崗</button><button onclick="print()">列印／存PDF</button><div id="msg" class="hint"></div></div>
<div class="box"><h3>4. 本週崗位表</h3><div class="scroll" id="out">尚未排班</div></div><div class="box"><h3>5. 本週統計</h3><div class="scroll" id="stats">尚未排班</div></div>
</main><script>
const P=['欣蓓','湞葶','佳怡','宜姗','博鈴','韋誠','佳愉','建凱','雅貞'],D=['週一','週二','週三','週四','週五','週六','週日'],S=['早診','午診','晚診'];
const can={'欣蓓':['櫃檯','藥局','後場'],'湞葶':['櫃檯','藥局','後場'],'佳怡':['櫃檯','藥局','後場'],'宜姗':['櫃檯','藥局','後場'],'博鈴':['櫃檯','藥局','後場'],'韋誠':['櫃檯','藥局'],'佳愉':['櫃檯','藥局','後場'],'建凱':['櫃檯','藥局'],'雅貞':['藥局','後場']};
let H=JSON.parse(localStorage.getItem('clinicH')||'{}');P.forEach(p=>H[p]??={'櫃檯':0,'藥局':0,'後場':0,'櫃檯＋藥局':0});
let R=[];
function init(){document.getElementById('days').innerHTML=D.map((d,i)=>`<div class="day"><b>${d}</b>${S.map((s,j)=>`<label>${s}<input id="a${i}_${j}" placeholder="欣蓓、佳怡"></label>`).join('')}</div>`).join('');drawH();addAdmin()}
function drawH(){document.getElementById('hist').innerHTML='<tr><th>人員</th><th>櫃檯</th><th>藥局</th><th>後場</th><th>櫃檯＋藥局</th></tr>'+P.map(p=>`<tr><td>${p}</td>${['櫃檯','藥局','後場','櫃檯＋藥局'].map(r=>`<td><input style="width:65px" type="number" min="0" id="h${P.indexOf(p)}_${r}" value="${H[p][r]||0}"></td>`).join('')}</tr>`).join('')}
function addAdmin(){let x=document.createElement('div');x.className='admin';x.innerHTML=`<select class="d"><option value="">日期</option>${D.map((v,i)=>`<option value="${i}">${v}</option>`)}</select><select class="s"><option value="">診別</option>${S.map((v,i)=>`<option value="${i}">${v}</option>`)}</select><select class="p">${P.map(v=>`<option>${v}</option>`)}</select><input class="t" placeholder="行政事項"><button onclick="this.parentNode.remove()">刪除</button>`;document.getElementById('admins').appendChild(x)}
function run(){
 P.forEach((p,i)=>['櫃檯','藥局','後場','櫃檯＋藥局'].forEach(r=>H[p][r]=+document.getElementById(`h${i}_${r}`).value||0));
 let AM={};document.querySelectorAll('.admin').forEach(x=>{let d=x.querySelector('.d').value,s=x.querySelector('.s').value,p=x.querySelector('.p').value,t=x.querySelector('.t').value.trim();if(d!==''&&s!==''&&t)(AM[d+'_'+s]??=[]).push({p,t})});
 R=[];let warn=[];
 for(let d=0;d<7;d++)for(let s=0;s<3;s++){
 let names=[...new Set(document.getElementById(`a${d}_${s}`).value.split(/[、,，\s]+/).filter(x=>P.includes(x)))],ad=AM[d+'_'+s]||[],blocked=ad.map(x=>x.p),avail=names.filter(x=>!blocked.includes(x)),r={d,s,ad,c:null,ph:null,b:null,combo:null};
 const choose=(list,role)=>list.sort((a,b)=>H[a][role]-H[b][role])[0];
 if(avail.length>=3){
 for(let [role,key] of [['櫃檯','c'],['藥局','ph'],['後場','b']]){let list=avail.filter(p=>!Object.values(r).includes(p)&&can[p].includes(role));if(list.length){r[key]=choose(list,role);H[r[key]][role]++}else warn.push(`${D[d]}${S[s]}：${role}無符合條件人員`)}
 }else if(avail.length===2){
 let opts=[];avail.forEach(c=>avail.forEach(b=>{if(c!==b&&can[c].includes('櫃檯')&&can[c].includes('藥局')&&can[b].includes('後場'))opts.push({c,b,score:H[c]['櫃檯＋藥局']+H[b]['後場']})}));
 opts.sort((x,y)=>x.score-y.score);if(opts.length){r.combo=opts[0].c;r.b=opts[0].b;H[r.combo]['櫃檯＋藥局']++;H[r.b]['後場']++}else warn.push(`${D[d]}${S[s]}：兩人配置不符合限制，請手動安排`);
 }else if(avail.length===1)warn.push(`${D[d]}${S[s]}：只有1位可安排人員，請手動處理`);
 R.push(r)
 }
 let html='<table><tr><th>日期</th><th>診別</th><th>櫃檯</th><th>藥局</th><th>後場</th><th>行政工作</th></tr>';
 R.forEach(r=>html+=`<tr><td>${D[r.d]}</td><td>${S[r.s]}</td><td>${r.combo||r.c||'—'}</td><td>${r.combo?'同櫃檯人員':r.ph||'—'}</td><td>${r.b||'—'}</td><td>${r.ad.map(x=>x.p+'：'+x.t).join('<br>')}</td></tr>`);
 document.getElementById('out').innerHTML=html+'</table>';document.getElementById('msg').innerHTML=warn.length?'<b style="color:#b91c1c">⚠️ '+warn.join('；')+'</b>':'<b style="color:green">完成，請人工確認排班結果。</b>';
 let C={};P.forEach(p=>C[p]={櫃檯:0,藥局:0,後場:0,'櫃檯＋藥局':0});R.forEach(r=>{if(r.combo){C[r.combo]['櫃檯＋藥局']++;C[r.b].後場++}else{if(r.c)C[r.c].櫃檯++;if(r.ph)C[r.ph].藥局++;if(r.b)C[r.b].後場++}});
 document.getElementById('stats').innerHTML='<table><tr><th>人員</th><th>櫃檯</th><th>藥局</th><th>後場</th><th>櫃檯＋藥局</th><th>總數</th></tr>'+P.map(p=>`<tr><td>${p}</td>${['櫃檯','藥局','後場','櫃檯＋藥局'].map(k=>`<td>${C[p][k]}</td>`).join('')}<td>${Object.values(C[p]).reduce((a,b)=>a+b,0)}</td></tr>`).join('')+'</table>';
 localStorage.setItem('clinicH',JSON.stringify(H));drawH()
}
init();
</script></body></html>
